[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# BOT Chain mainnet and Bohr testnet both run Cancun opcodes (checked with eth_call probes).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
cbor_metadata = false
remappings = [
  "kernel/=lib/kernel/src/",
  "solady/=lib/kernel/lib/solady/src/",
  "ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bot = "https://rpc.botchain.ai"
bohr = "https://rpc.bohr.life"

[fuzz]
runs = 256
